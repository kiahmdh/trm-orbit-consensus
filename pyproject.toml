[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-consensus"
version = "0.1.0"
description = "Training-free structured aggregation for cached TRM augmentation orbits"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Kiarash Hamidieh" },
  { name = "Aida Aryafar" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
